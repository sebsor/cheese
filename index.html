<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17140F">
<title>Affinage — Cheese Ledger</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#17140F;
    --night-2:#1F1A13;
    --night-line:rgba(201,169,97,0.22);
    --gold:#C9A961;
    --gold-soft:#E4CD98;
    --gold-deep:#9C7C3E;
    --cream:#F3EFE6;
    --card:#FFFFFF;
    --card-line:#E4DCC6;
    --ink:#231D15;
    --stone:#8B8172;
    --stone-soft:#B4AA98;
    --wine:#7A2E2A;
    --wine-bright:#9C3E38;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:40px;
  }
  a{color:var(--gold-deep);}

  /* ---------- Hero (dark masthead) ---------- */
  .hero{
    background:var(--night);
    background-image:
      radial-gradient(ellipse at 30% 0%, rgba(201,169,97,0.10), transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(122,46,42,0.14), transparent 50%);
    padding:56px 20px 40px;
    text-align:center;
  }
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 14px;
  }
  .eyebrow .diamond{color:var(--gold-deep);margin:0 10px;}
  h1.script{
    font-family:'Pinyon Script',cursive;
    font-weight:400;
    font-size:clamp(52px,10vw,84px);
    margin:0;
    line-height:1;
    color:var(--gold-soft);
    text-shadow:0 2px 24px rgba(201,169,97,0.25);
  }
  .hero-divider{
    width:120px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
    margin:20px auto 18px;
  }
  .hero-sub{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:19px;
    color:var(--stone-soft);
    max-width:440px;
    margin:0 auto;
    line-height:1.5;
  }
  .stats-line{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:0.02em;
    color:var(--gold-deep);
    margin-top:22px;
  }

  /* ---------- Cellar section (cream) ---------- */
  .cellar-section{
    max-width:1100px;
    margin:0 auto;
    padding:0 20px;
  }
  .toolbar{
    padding:20px 0 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    position:sticky;
    top:0;
    z-index:20;
    background:var(--cream);
    box-shadow:0 8px 12px -4px rgba(35,29,21,0.06);
  }
  .search-row{
    display:flex;
    gap:8px;
  }
  input[type="search"]{
    flex:1;
    background:var(--card);
    border:1px solid var(--card-line);
    color:var(--ink);
    padding:13px 16px;
    border-radius:4px;
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  input[type="search"]:focus{
    outline:none;
    border-color:var(--gold-deep);
  }
  .book-toggle{
    background:var(--card);
    border:1px solid var(--card-line);
    color:var(--ink);
    padding:12px 18px;
    border-radius:4px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    cursor:pointer;
    white-space:nowrap;
  }
  .book-toggle.active{
    background:var(--wine);
    border-color:var(--wine);
    color:#fff;
  }
  .filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  select{
    background:var(--card);
    border:1px solid var(--card-line);
    color:var(--ink);
    padding:12px 12px;
    border-radius:4px;
    font-size:14px;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    min-height:44px;
  }
  select:focus{outline:none;border-color:var(--gold-deep);}

  main{
    padding:8px 0 20px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:16px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:2px;
    padding:22px 18px;
    cursor:pointer;
    transition:border-color .15s, transform .15s, box-shadow .15s;
    text-align:center;
  }
  .card:hover{
    border-color:var(--gold-deep);
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(35,29,21,0.08);
  }
  .seal{
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--night);
    border:1.5px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:20px;
    color:var(--gold-soft);
    margin:0 auto 14px;
  }
  .card-body{min-width:0;}
  .card-name{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:17px;
    margin:0 0 6px;
    line-height:1.25;
    color:var(--ink);
  }
  .card-meta{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:14px;
    color:var(--stone);
    margin:0 0 12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .tag-row{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .tag{
    font-family:'Inter',sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:20px;
    background:var(--cream);
    color:var(--stone);
    border:1px solid var(--card-line);
  }
  .mini-dial{
    margin-top:12px;
    display:flex;
    gap:3px;
    justify-content:center;
  }
  .mini-wedge{
    width:8px;height:8px;border-radius:50%;
    background:var(--cream);
    border:1px solid var(--card-line);
  }
  .mini-wedge.filled{
    background:var(--wine);
    border-color:var(--wine);
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--stone);
  }
  .empty-state .seal{
    margin:0 auto 16px;
    width:60px;height:60px;font-size:22px;
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(23,20,15,0.78);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:20px;
    overflow-y:auto;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    z-index:100;
    backdrop-filter:blur(2px);
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:6px;
    max-width:560px;
    width:100%;
    margin-top:min(6vh,60px);
    padding:30px;
    position:relative;
  }
  .modal-close{
    position:absolute;
    top:18px;right:18px;
    background:var(--cream);
    border:1px solid var(--card-line);
    color:var(--stone);
    width:32px;height:32px;
    border-radius:50%;
    cursor:pointer;
    font-size:16px;
    line-height:1;
  }
  .modal-header{
    display:flex;
    gap:16px;
    align-items:center;
    margin-bottom:6px;
    padding-right:36px;
  }
  .modal .seal{width:60px;height:60px;font-size:23px;margin:0;flex-shrink:0;}
  .modal-title{
    font-family:'Playfair Display',serif;
    font-weight:800;
    font-size:27px;
    margin:0;
    line-height:1.15;
    color:var(--ink);
  }
  .modal-sub{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    color:var(--stone);
    font-size:15px;
    margin:4px 0 0;
  }
  .modal-tags{
    margin:16px 0;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }

  .pairing-section{
    margin-top:20px;
    padding-top:20px;
    border-top:1px solid var(--card-line);
  }
  .pairing-note{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:15px;
    color:var(--stone);
    margin:0 0 16px;
    line-height:1.5;
  }
  .pairing-cols{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:16px;
  }
  .pairing-col dt{
    font-family:'Inter',sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--gold-deep);
    margin:0 0 6px;
  }
  .pairing-col dd{
    margin:0 0 3px;
    font-family:'Cormorant Garamond',serif;
    font-size:15px;
    color:var(--ink);
    line-height:1.35;
  }
  .detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px 18px;
    margin:18px 0;
    font-size:13px;
  }
  .detail-item dt{
    font-family:'Inter',sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--gold-deep);
    margin:0 0 3px;
  }
  .detail-item dd{
    margin:0;
    color:var(--ink);
    font-family:'Cormorant Garamond',serif;
    font-size:16px;
  }
  .modal-link{
    display:inline-block;
    font-size:12px;
    margin-top:2px;
    color:var(--gold-deep);
    text-decoration:none;
    border-bottom:1px solid var(--gold-deep);
  }

  .rating-section{
    margin-top:24px;
    padding-top:22px;
    border-top:1px solid var(--card-line);
  }
  .rating-label{
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--gold-deep);
    margin:0 0 12px;
  }
  .dial-row{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:18px;
  }
  .dial{cursor:pointer;}
  .dial-wedge{
    fill:var(--cream);
    stroke:var(--card-line);
    stroke-width:1.5;
    transition:fill .1s;
  }
  .dial-wedge.filled{
    fill:var(--wine);
    stroke:var(--wine-bright);
  }
  .dial-center{
    fill:var(--card);
    stroke:var(--gold);
    stroke-width:1.5;
  }
  .rating-readout{
    font-family:'Playfair Display',serif;
    font-size:15px;
    color:var(--ink);
  }
  .rating-readout .n{color:var(--wine);font-weight:700;}
  textarea{
    width:100%;
    background:var(--cream);
    border:1px solid var(--card-line);
    color:var(--ink);
    border-radius:4px;
    padding:12px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    resize:vertical;
    min-height:80px;
  }
  textarea:focus{outline:none;border-color:var(--gold-deep);}
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
    align-items:center;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:12px 20px;
    border-radius:4px;
    border:1px solid var(--card-line);
    background:var(--cream);
    color:var(--ink);
    cursor:pointer;
  }
  .btn-primary{
    background:var(--night);
    border-color:var(--night);
    color:var(--gold-soft);
  }
  .btn-ghost{
    background:transparent;
    color:var(--stone);
  }
  .save-flash{
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--gold-deep);
    opacity:0;
    transition:opacity .2s;
  }
  .save-flash.show{opacity:1;}

  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-track{background:var(--cream);}
  ::-webkit-scrollbar-thumb{background:var(--card-line);border-radius:6px;}

  @media (max-width:640px){
    .hero{padding:36px 16px 26px;}
    .cellar-section{padding:0 14px;}

    /* filters as a clean 2-column grid instead of ragged wrapping */
    .filters{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }
    select{width:100%;}

    .search-row{flex-direction:column;}
    .book-toggle{width:100%;min-height:44px;}
    input[type="search"]{min-height:44px;font-size:16px;} /* 16px avoids iOS auto-zoom on focus */

    .grid{grid-template-columns:1fr 1fr;gap:10px;}
    .card{padding:16px 10px;}
    .seal{width:46px;height:46px;font-size:17px;margin-bottom:10px;}
    .card-name{font-size:15px;}
    .card-meta{font-size:12px;}

    .overlay.open{display:block;}
    .overlay{padding:0;}
    .modal{
      max-width:none;
      width:100%;
      min-height:100vh;
      margin:0;
      border-radius:0;
      padding:22px 18px 32px;
    }
    .pairing-cols{grid-template-columns:1fr 1fr;gap:12px;}
    .pairing-cols .pairing-col:nth-child(3){grid-column:1 / -1;}
    .modal-title{font-size:23px;}
  }

  @media (max-width:380px){
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header class="hero">
  <p class="eyebrow"><span class="diamond">✦</span>A curated cellar<span class="diamond">✦</span></p>
  <h1 class="script">Affinage</h1>
  <div class="hero-divider"></div>
  <p class="hero-sub">Search, browse, and mark down what's worth aging for.</p>
  <p class="stats-line" id="statsLine">Loading the cellar…</p>
</header>

<div class="cellar-section">
  <div class="toolbar">
    <div class="search-row">
      <input type="search" id="searchInput" placeholder="Search by name, producer, or family…" autocomplete="off">
      <button class="book-toggle" id="bookToggle">My Book</button>
    </div>
    <div class="filters">
      <select id="milkFilter"><option value="">Any milk</option></select>
      <select id="countryFilter"><option value="">Any country</option></select>
      <select id="typeFilter"><option value="">Any type</option></select>
      <select id="ratingFilter">
        <option value="">Any rating</option>
        <option value="rated">Rated only</option>
        <option value="unrated">Unrated only</option>
        <option value="5">★ 5</option>
        <option value="4">★ 4+</option>
        <option value="3">★ 3+</option>
      </select>
      <select id="sortSelect">
        <option value="name">Sort: Name A–Z</option>
        <option value="country">Sort: Country</option>
        <option value="rating-desc">Sort: My rating (high→low)</option>
        <option value="recent">Sort: Recently rated</option>
      </select>
    </div>
  </div>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <div class="seal">∅</div>
      <p>No cheeses match that combination. Try loosening a filter.</p>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
const RATINGS_KEY = 'affinage-ratings-v1';
let CHEESES = [];
let ratings = {};
let currentId = null;
let bookMode = false;

// ---------- storage ----------
function loadRatings(){
  try{
    ratings = JSON.parse(localStorage.getItem(RATINGS_KEY)) || {};
  }catch(e){ ratings = {}; }
}
function saveRatings(){
  localStorage.setItem(RATINGS_KEY, JSON.stringify(ratings));
}

// ---------- init ----------
async function init(){
  loadRatings();
  try{
    const res = await fetch('cheeses.json');
    CHEESES = await res.json();
  }catch(e){
    document.getElementById('statsLine').textContent = 'Could not load cheese data.';
    return;
  }
  populateFilters();
  render();
  registerSW();
}

function populateFilters(){
  const countries = new Set(), milks = new Set(), types = new Set();
  CHEESES.forEach(c=>{
    c.country.forEach(x=>countries.add(x));
    c.milk.forEach(x=>milks.add(x));
    c.type.forEach(x=>types.add(x));
  });
  fillSelect('countryFilter', [...countries].sort());
  fillSelect('milkFilter', [...milks].sort());
  fillSelect('typeFilter', [...types].sort());
}
function fillSelect(id, values){
  const sel = document.getElementById(id);
  values.forEach(v=>{
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v[0].toUpperCase()+v.slice(1);
    sel.appendChild(opt);
  });
}

// ---------- filtering / sorting ----------
function getFiltered(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const milk = document.getElementById('milkFilter').value;
  const country = document.getElementById('countryFilter').value;
  const type = document.getElementById('typeFilter').value;
  const ratingF = document.getElementById('ratingFilter').value;
  const sort = document.getElementById('sortSelect').value;

  let list = CHEESES.filter(c=>{
    if(bookMode && !ratings[c.id]) return false;
    if(q){
      const hay = (c.name+' '+(c.producers||'')+' '+(c.family||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(milk && !c.milk.includes(milk)) return false;
    if(country && !c.country.includes(country)) return false;
    if(type && !c.type.includes(type)) return false;
    if(ratingF){
      const r = ratings[c.id]?.rating || 0;
      if(ratingF === 'rated' && r === 0) return false;
      if(ratingF === 'unrated' && r !== 0) return false;
      if(!isNaN(parseInt(ratingF)) && r < parseInt(ratingF)) return false;
    }
    return true;
  });

  if(sort === 'name'){
    list.sort((a,b)=>a.name.localeCompare(b.name));
  } else if(sort === 'country'){
    list.sort((a,b)=>(a.country[0]||'zzz').localeCompare(b.country[0]||'zzz') || a.name.localeCompare(b.name));
  } else if(sort === 'rating-desc'){
    list.sort((a,b)=>((ratings[b.id]?.rating||0) - (ratings[a.id]?.rating||0)) || a.name.localeCompare(b.name));
  } else if(sort === 'recent'){
    list.sort((a,b)=>{
      const ra = ratings[a.id]?.ratedAt || '';
      const rb = ratings[b.id]?.ratedAt || '';
      return rb.localeCompare(ra);
    });
  }
  return list;
}

// ---------- render ----------
function render(){
  const list = getFiltered();
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  grid.innerHTML = '';

  if(list.length === 0){
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    const frag = document.createDocumentFragment();
    list.forEach(c=>frag.appendChild(cardEl(c)));
    grid.appendChild(frag);
  }

  const ratedCount = Object.keys(ratings).length;
  document.getElementById('statsLine').textContent =
    `${CHEESES.length.toLocaleString()} cheeses in the cellar · ${ratedCount} rated · showing ${list.length.toLocaleString()}`;
}

function cardEl(c){
  const div = document.createElement('div');
  div.className = 'card';
  div.onclick = ()=>openModal(c.id);

  const seal = document.createElement('div');
  seal.className = 'seal';
  seal.textContent = c.name[0].toUpperCase();

  const body = document.createElement('div');
  body.className = 'card-body';

  const name = document.createElement('p');
  name.className = 'card-name';
  name.textContent = c.name;

  const meta = document.createElement('p');
  meta.className = 'card-meta';
  meta.textContent = [c.country[0], c.family].filter(Boolean).join(' · ') || '—';

  const tagRow = document.createElement('div');
  tagRow.className = 'tag-row';
  [...c.milk.slice(0,1), ...c.type.slice(0,1)].forEach(t=>{
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = t;
    tagRow.appendChild(tag);
  });

  body.appendChild(name);
  body.appendChild(meta);
  body.appendChild(tagRow);

  const r = ratings[c.id]?.rating;
  if(r){
    const dial = document.createElement('div');
    dial.className = 'mini-dial';
    for(let i=1;i<=5;i++){
      const w = document.createElement('div');
      w.className = 'mini-wedge' + (i<=r ? ' filled' : '');
      dial.appendChild(w);
    }
    body.appendChild(dial);
  }

  div.appendChild(seal);
  div.appendChild(body);
  return div;
}

// ---------- modal ----------
function openModal(id){
  currentId = id;
  const c = CHEESES.find(x=>x.id===id);
  const r = ratings[id] || {rating:0, notes:''};
  const pairing = getPairing(c);
  const modal = document.getElementById('modal');

  const detailRows = [
    ['Milk', c.milk.join(', ') || '—'],
    ['Country', c.country.join(', ') || '—'],
    ['Region', c.region || '—'],
    ['Family', c.family || '—'],
    ['Type', c.type.join(', ') || '—'],
    ['Texture', c.texture.join(', ') || '—'],
    ['Rind', c.rind || '—'],
    ['Color', c.color || '—'],
    ['Flavor', c.flavor.join(', ') || '—'],
    ['Aroma', c.aroma.join(', ') || '—'],
  ];

  modal.innerHTML = `
    <button class="modal-close" id="closeBtn">✕</button>
    <div class="modal-header">
      <div class="seal">${c.name[0].toUpperCase()}</div>
      <div>
        <h2 class="modal-title">${escapeHtml(c.name)}</h2>
        <p class="modal-sub">${escapeHtml(c.producers || 'Producer unknown')}</p>
      </div>
    </div>
    <a class="modal-link" href="https://www.google.com/search?q=${encodeURIComponent(c.name + ' cheese' + (c.country[0] ? ' ' + c.country[0] : ''))}" target="_blank" rel="noopener">Search for it online ↗</a>
    <dl class="detail-grid">
      ${detailRows.map(([k,v])=>`
        <div class="detail-item"><dt>${k}</dt><dd>${escapeHtml(v)}</dd></div>
      `).join('')}
    </dl>
    ${(c.vegetarian || c.vegan) ? `<div class="modal-tags">
      ${c.vegetarian ? '<span class="tag">vegetarian</span>' : ''}
      ${c.vegan ? '<span class="tag">vegan</span>' : ''}
    </div>` : ''}

    <div class="pairing-section">
      <p class="rating-label">Pairs well with</p>
      <p class="pairing-note">${escapeHtml(pairing.note)} <em>General guidance based on cheese style, not curated for this specific cheese.</em></p>
      <div class="pairing-cols">
        <dl class="pairing-col"><dt>Drink</dt>${pairing.drink.map(x=>`<dd>${escapeHtml(x)}</dd>`).join('')}</dl>
        <dl class="pairing-col"><dt>Sweet</dt>${pairing.sweet.map(x=>`<dd>${escapeHtml(x)}</dd>`).join('')}</dl>
        <dl class="pairing-col"><dt>Savory</dt>${pairing.savory.map(x=>`<dd>${escapeHtml(x)}</dd>`).join('')}</dl>
      </div>
    </div>

    <div class="rating-section">
      <p class="rating-label">Your rating</p>
      <div class="dial-row">
        ${dialSVG(r.rating)}
        <span class="rating-readout" id="ratingReadout">${r.rating ? `<span class="n">${r.rating}</span> / 5` : 'Not yet rated'}</span>
      </div>
      <p class="rating-label">Notes</p>
      <textarea id="notesInput" placeholder="How was it? Pairs well with…">${escapeHtml(r.notes||'')}</textarea>
      <div class="modal-actions">
        <button class="btn btn-primary" id="saveBtn">Save</button>
        ${r.rating || r.notes ? '<button class="btn btn-ghost" id="clearBtn">Clear</button>' : ''}
        <span class="save-flash" id="saveFlash">Saved ✓</span>
      </div>
    </div>
  `;

  document.getElementById('overlay').classList.add('open');
  lockBodyScroll();
  document.getElementById('closeBtn').onclick = closeModal;

  let pendingRating = r.rating || 0;
  const dialEl = modal.querySelector('.dial');
  modal.querySelectorAll('.dial-wedge').forEach(w=>{
    w.onclick = ()=>{
      pendingRating = parseInt(w.dataset.n);
      updateDialDisplay(pendingRating);
    };
    w.onmouseenter = ()=>{
      updateDialDisplay(parseInt(w.dataset.n));
    };
  });
  if(dialEl){
    dialEl.onmouseleave = ()=>{
      updateDialDisplay(pendingRating);
    };
  }

  document.getElementById('saveBtn').onclick = ()=>{
    const notes = document.getElementById('notesInput').value.trim();
    if(pendingRating === 0 && !notes){
      delete ratings[id];
    } else {
      ratings[id] = {
        rating: pendingRating,
        notes: notes,
        ratedAt: new Date().toISOString()
      };
    }
    saveRatings();
    flashSaved();
    render();
  };

  const clearBtn = document.getElementById('clearBtn');
  if(clearBtn){
    clearBtn.onclick = ()=>{
      delete ratings[id];
      saveRatings();
      closeModal();
      render();
    };
  }
}

function updateDialDisplay(n){
  document.querySelectorAll('.dial-wedge').forEach(w=>{
    w.classList.toggle('filled', parseInt(w.dataset.n) <= n);
  });
  document.getElementById('ratingReadout').innerHTML = n ? `<span class="n">${n}</span> / 5` : 'Not yet rated';
}

function flashSaved(){
  const f = document.getElementById('saveFlash');
  if(!f) return;
  f.classList.add('show');
  setTimeout(()=>f.classList.remove('show'), 1400);
}

function dialSVG(current){
  // 5 pie wedges around a center circle, clickable
  const cx=50, cy=50, rOuter=46, rInner=20;
  let wedges = '';
  for(let i=0;i<5;i++){
    const startAngle = -90 + i*72;
    const endAngle = startAngle + 68;
    const p1 = polar(cx,cy,rOuter,startAngle);
    const p2 = polar(cx,cy,rOuter,endAngle);
    const p3 = polar(cx,cy,rInner,endAngle);
    const p4 = polar(cx,cy,rInner,startAngle);
    const n = i+1;
    const filled = n <= current ? ' filled' : '';
    wedges += `<path class="dial-wedge${filled}" data-n="${n}"
      d="M ${p1.x} ${p1.y} A ${rOuter} ${rOuter} 0 0 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rInner} ${rInner} 0 0 0 ${p4.x} ${p4.y} Z" />`;
  }
  return `<svg class="dial" width="100" height="100" viewBox="0 0 100 100">
    ${wedges}
    <circle class="dial-center" cx="${cx}" cy="${cy}" r="${rInner-2}" />
  </svg>`;
}
function polar(cx,cy,r,angleDeg){
  const a = (angleDeg * Math.PI)/180;
  return { x: cx + r*Math.cos(a), y: cy + r*Math.sin(a) };
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  currentId = null;
  unlockBodyScroll();
}

let lockedScrollY = 0;
function lockBodyScroll(){
  lockedScrollY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${lockedScrollY}px`;
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
}
function unlockBodyScroll(){
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  window.scrollTo(0, lockedScrollY);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- pairing suggestions (style-based, not per-cheese curated data) ----------
const PAIRING_STYLES = {
  blue: {
    note: "Salty and pungent — needs sweetness in the glass and on the plate to balance it.",
    drink: ['Sweet white wine (Sauternes-style)', 'Sweet red or fortified wine (Port)'],
    sweet: ['Fig jam', 'Honey'],
    savory: ['Toasted walnuts', 'Dark rye bread']
  },
  washed: {
    note: "Assertive, aromatic rind — stands up to bold, malty, or spicy pairings.",
    drink: ['Aromatic white wine', 'Belgian-style ale'],
    sweet: ['Onion or fig jam'],
    savory: ['Crusty bread', 'Cured ham']
  },
  bloomy: {
    note: "Creamy and delicate — best matched with something light and acidic rather than heavy.",
    drink: ['Sparkling wine', 'Crisp, fruity white wine'],
    sweet: ['Apple or pear preserves'],
    savory: ['Baguette', 'Toasted almonds']
  },
  fresh: {
    note: "Bright, tangy, and light — wants acidity alongside it rather than tannin or sweetness.",
    drink: ['Crisp, fruity white wine', 'Dry rosé or sparkling wine'],
    sweet: ['Citrus marmalade', 'Honey'],
    savory: ['Olive oil & herbs', 'Crisp crackers']
  },
  goatFresh: {
    note: "Tangy and light with a citrus edge — a sharp, acidic white is the classic match.",
    drink: ['Sauvignon Blanc-style white wine'],
    sweet: ['Citrus marmalade', 'Honey'],
    savory: ['Crackers', 'Fresh herbs']
  },
  hard: {
    note: "Concentrated and often nutty from aging — can carry full-bodied, robust pairings.",
    drink: ['Full-bodied red wine', 'Rich, oak-aged white wine'],
    sweet: ['Quince paste (membrillo)', 'Fig jam'],
    savory: ['Toasted walnuts', 'Cured charcuterie']
  },
  semi: {
    note: "Balanced and mild — flexible with most classic pairings.",
    drink: ['Medium-bodied red wine', 'Off-dry white wine'],
    sweet: ['Apricot or peach preserves'],
    savory: ['Whole-grain mustard', 'Crusty bread']
  }
};

function getPairing(c){
  const type = c.type.map(t=>t.toLowerCase());
  const rind = (c.rind||'').toLowerCase();
  const milk = c.milk.map(m=>m.toLowerCase());
  const flavorAroma = [...c.flavor, ...c.aroma].map(f=>f.toLowerCase());

  let key;
  if(type.includes('blue-veined')){
    key = 'blue';
  } else if(rind === 'washed' || type.includes('smear-ripened')){
    key = 'washed';
  } else if(rind === 'bloomy' || type.some(t=>t.includes('soft-ripened'))){
    key = 'bloomy';
  } else if(milk.includes('goat') && (type.some(t=>t.includes('fresh')) || type.includes('brined'))){
    key = 'goatFresh';
  } else if(type.some(t=>t.includes('fresh')) || type.includes('brined') || type.includes('whey')){
    key = 'fresh';
  } else if(type.includes('hard')){
    key = 'hard';
  } else {
    key = 'semi';
  }

  const base = PAIRING_STYLES[key];
  const pairing = {
    note: base.note,
    drink: [...base.drink],
    sweet: [...base.sweet],
    savory: [...base.savory]
  };

  if(flavorAroma.some(f=>f.includes('smokey') || f.includes('smoky'))){
    pairing.drink.push('Smoky whisky or bourbon');
    pairing.sweet.push('Apple butter');
  }

  return pairing;
}

    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
